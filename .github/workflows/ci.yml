name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'GitHub-hosted runner executed a step without checkout or setup actions'
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m factory run examples/task.en.json
      - run: python -m factory.architecture run examples/architecture.en.json
      - run: python -m factory.architecture --project arabic run examples/architecture.ar.json
